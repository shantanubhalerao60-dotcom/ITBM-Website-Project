  <path d="M 130 105 L 115 160 L 105 320 C 105 345 130 352 200 352 C 270 352 295 345 295 320 L 285 160 L 270 105 Z" fill="url(#pouchGrad)" stroke="#cbd5e1" stroke-width="1.5"/>

