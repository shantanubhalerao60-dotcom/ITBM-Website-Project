  <defs>
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
